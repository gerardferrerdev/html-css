<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
    <style>
        body{
            background-image: linear-gradient(to left, rgb(86, 86, 167),  rgb(64, 114, 161));
        
        }
        div.contain{
            background-color: rgba(0, 0, 0, 0.151);
            padding: 25px;
            margin: 10px;
            text-align: center;
            color: rgb(1, 28, 37);
            width: 60vh;
            font-size: 2em;
            margin: auto;
            border-radius: 20px;
            box-shadow: black 10px 10px 35px;
        
        }
        .botton{
            margin-left: 80px;
        }
        .bot{
            border-radius: 10px;
            background-color: blue;
            text-decoration: none;
            border: none;
            font-size: 0.5em;

        }
        
    </style>
</head>
<body>
    <div class="container">
        <div class="contain">
            <form action="cadastro.php" method="post" autocomplete="off">
            <p>
                <label for="iusu">Usuario</label>
                <input type="text" name="usuario" id="iusu" placeholder="Nome do Usuário" size="10" required minlength="5">
            </p>
            <p>
                 <label for="isenha">Senha    </label>
                 <input type="password" name="senha" id="isenha"  placeholder="Senha do Usuário" required minlength="8" maxlength="20" size="10">
            </p>
            <p class="botton">
                <input type="submit" value="Enviar" class="bot">
                <input type="reset" value="Limpar" class="bot">
            </p>
            </form>
        </div>
    </div>
</body>
</html>
