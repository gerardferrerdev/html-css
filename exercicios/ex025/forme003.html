<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Teste de formulário</h1>
    <form action="cadrastro.php" method="get" autocomplete="on">
    <p>
        <label for="inome">Nome*</label>
        <input type="text" name="Nome" id="inome" autocomplete="username" maxlength="30" minlength="5" placeholder="Nome Completo" required>
    </p>
    <p>
        <label for="isenha">Senha*</label>
        <input type="password" name="Senha" id="isenha" minlength="6" maxlength="20" placeholder="No Minimo 6 Caracteres">
    </p>
    <p>
        <label for="imedia">Média</label>
        <input type="number" name="Media" id="imedia" placeholder="De 0 a 10" step="0.1" min="0" max="10" >
    </p>
    <p>
        <label for="idata">Dia da Prova</label>
        <input type="date" name="data" id="idata">
    </p>
    <p>
        <label for="ihora">Horario da Prova</label>
        <input type="time" name="Horario" id="ihora">
    </p>
    <p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">
    </p>
    </form>

    
</body>
</html>
