<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>

<form action="" method="get">
    <p>
        <label for="in1">Escolha um numero</label> <br>
        <input type="number" name="numero" id="in1" min="0" max="50" placeholder="Até 50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
    </p>
     <p>
        <label for="in2">Escolha outro numero</label> <br>
        <input type="number" name="numero" id="in2" min="0" max="50" placeholder="Até 50" required oninput="isoma.innerHTML = Number(in1.value) + Number(in2.value)">
    </p>
    <p>
        <label for="isoma">soma:</label>
        <output id="isoma">0</output>
    </p>
    <input type="submit" value="Enviar">
    <input type="reset" value="Limpar">
</form>
    
</body>
</html>
