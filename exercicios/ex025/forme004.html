<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on"> 
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p>
                <label for="inome">Nome*</label>
                <input type="text" name="name"id="inome" required autocomplete="nickname" placeholder="                Seu nome">
            </p>
            <p>
                <label for="iemail">Email*</label>
                <input type="email" name="Email" id="iemail" autocomplete="email" required placeholder="
                Seu email">
            </p>
            <p>
                <label for="itel">Telefone*</label>
                <input type="tel" name="Telefone" id="itel" autocomplete="tel" required placeholder="(xx) xxxxx-xxxx">
            </p>
            <p>
            </p>
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Limpar">
            </p>
            
        </fieldset>
    </form>
</body>
</html>
