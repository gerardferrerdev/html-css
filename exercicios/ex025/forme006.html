<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>formulario</title>
</head>
<body>
    <h1>exemplo de formulario</h1>
    <form action="registro.php" method="post">
        <p>
            <label for="icor">Cor</label>
            <input type="color" name="cor" id="icor">
        </p>
        <p>
            <label for="isat">Nivel de Satisfação</label>
            <input type="range" name="sat" id="isat" min="1" max="5" value="1">
        </p>
        <p>
            <label for="iimag">Foto de Perfil</label>
            <input type="file" name="Foto" id="iimag">
        </p>
        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">


    </form>
</body>
</html>
